version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smartdocs_db
    environment:
      POSTGRES_DB: smartdocs_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartdocs_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartdocs_backend
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartdocs_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: text-embedding-3-small
      LLM_MODEL: gpt-4o-mini
      CHUNK_SIZE: 500
      CHUNK_OVERLAP: 80
      TOP_K: 4
      RETRIEVAL_STRATEGY: hybrid
      SIMILARITY_THRESHOLD: 0.40
      MMR_LAMBDA: 0.70
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartdocs_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
